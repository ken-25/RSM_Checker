<svg
  xmlns="http://www.w3.org/2000/svg"
  width="64"
  height="64"
  viewBox="0 0 64 64"
>
  <!-- 背景（淡いグレー、角丸） -->
  <rect width="64" height="64" rx="12" fill="#F5F5F7" />

  <!-- 回転球体法の「球体」をイメージした円弧 -->
  <path
    d="M10 38
       C14 22, 28 12, 42 12
       C50 12, 58 16, 62 22"
    fill="none"
    stroke="#4B5563"
    stroke-width="2.6"
    stroke-linecap="round"
  />

  <!-- 保護対象の「構造物」を示すベースライン -->
  <line
    x1="10"
    y1="42"
    x2="54"
    y2="42"
    stroke="#9CA3AF"
    stroke-width="2.6"
    stroke-linecap="round"
  />

  <!-- 力強い稲妻アイコン（20度回転・太く・面積大きめ） -->
  <g transform="rotate(20 32 24)">
    <path
      d="M38 4
         L22 30
         H30
         L22 50
         L42 26
         H34
         Z"
      fill="#F97316"
    />
  </g>

  <!-- 保護点イメージの小さな円（稲妻とは非接触） -->
  <circle
    cx="32"
    cy="42"
    r="3.2"
    fill="#111827"
  />
</svg>